# ── Main context ────────────────────────────────────────────
# Worker processes — "auto" sets one per CPU core
worker_processes auto;

events {
    # Max simultaneous connections per worker
    worker_connections 1024;
}

# ── HTTP context ─────────────────────────────────────────────
# Everything HTTP-related must live inside this block
http {

    # ── Logging ───────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ── Rate limiting zone ────────────────────────────────
    # Must be inside http {}, not at the top level
    # Creates a shared memory zone called "api_limit"
    # Tracks by IP address, allows 60 requests per minute
    limit_req_zone $binary_remote_addr
                   zone=api_limit:10m
                   rate=60r/m;

    # ── Upstream — Router service ─────────────────────────
    # Points to the router container which handles
    # consistent hashing to the correct shard
    upstream router_service {
        least_conn;              # least busy router instance
        server router:8000;      # Docker resolves "router" to the container
    }

    # ── Server block — HTTP on port 80 ────────────────────
    server {
        listen 80;
        server_name _;           # accept any hostname

        # ── Rate limiting ──────────────────────────────
        # burst=20: allow short spikes up to 20 extra requests
        # nodelay: reject immediately if over limit (don't queue)
        limit_req zone=api_limit burst=20 nodelay;

        # ── Reverse proxy to Router ────────────────────
        location / {
            proxy_pass http://router_service;

            # Pass real client IP to the router
            # Without these, router sees Nginx's internal IP
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ── Nginx health check ─────────────────────────
        # Nginx itself responds here — separate from
        # the application /health endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ── Admin endpoints — restrict access ──────────
        # /admin/* should not be publicly accessible
        # Allow only internal Docker network (172.16.0.0/12)
        location /admin/ {
            allow  172.16.0.0/12;   # Docker internal network
            deny   all;             # block everything else
            proxy_pass http://router_service;
            proxy_set_header Host $host;
        }
    }
}